<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Fit_system</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-gray-100">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-2xl bg-gray-900 text-white flex items-center justify-center font-black text-base shadow">Fit</div>

      <div class="min-w-0 flex-1">
        <div class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold">Активный профиль</div>
        <div id="active-profile" class="truncate font-black text-base leading-tight">—</div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <button id="btn-refresh" class="px-3 py-2 rounded-xl bg-gray-900 text-white font-extrabold text-xs uppercase tracking-widest hover:bg-indigo-600 transition">
          Обновить
        </button>
        <a href="/builder" class="px-3 py-2 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-700 font-extrabold text-xs uppercase tracking-widest hover:bg-indigo-100 transition">
          Builder
        </a>
        <button id="btn-cabinet" class="px-3 py-2 rounded-xl bg-white border border-gray-200 text-gray-700 font-extrabold text-xs uppercase tracking-widest hover:border-indigo-300 hover:text-indigo-700 transition">
          Кабинет
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-5 pb-10">
    <div id="toast" class="hidden mb-4 p-3 rounded-2xl bg-gray-900 text-white text-sm shadow-lg"></div>

    <section id="main-view">
      <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <div id="empty-state" class="hidden mt-10 text-center">
        <div class="text-sm text-gray-600">Нет активного профиля или подходящих товаров.</div>
        <button id="btn-open-cabinet" class="mt-4 px-4 py-2 rounded-xl bg-gray-900 text-white font-extrabold text-xs uppercase tracking-widest">
          Открыть кабинет
        </button>
      </div>
    </section>

    <section id="cabinet-view" class="hidden">
      <div class="flex items-center justify-between gap-3 mt-1">
        <h1 class="text-lg font-black">Кабинет</h1>
        <div class="flex items-center gap-2">
          <button id="btn-admin" class="px-3 py-2 rounded-xl bg-gray-50 border border-gray-200 text-gray-700 font-extrabold text-[11px] uppercase tracking-widest">
            Админка
          </button>
          <button id="btn-back" class="px-3 py-2 rounded-xl bg-gray-900 text-white font-extrabold text-[11px] uppercase tracking-widest">
            Назад
          </button>
        </div>
      </div>

      <div class="mt-4 grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-4">
          <div class="flex items-center justify-between gap-3">
            <div class="font-black">Профили</div>
          </div>
          <div id="profiles" class="mt-3 space-y-3"></div>
          <div id="profiles-empty" class="hidden mt-3 text-sm text-gray-500">Профилей пока нет. Добавь новый справа.</div>
        </div>

        <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-4">
          <div class="flex items-center justify-between gap-3">
            <div id="form-title" class="font-black">Новый профиль</div>
            <button id="btn-clear-form" class="px-3 py-2 rounded-xl bg-gray-50 border border-gray-200 text-gray-700 font-extrabold text-[11px] uppercase tracking-widest">
              Очистить
            </button>
          </div>

          <form id="profile-form" class="mt-4 space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <label class="block">
                <div class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold mb-1">Имя (уникальное)</div>
                <input name="name" class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" placeholder="Например: Иван"/>
              </label>

              <label class="block">
                <div class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold mb-1">Пол</div>
                <select name="gender" class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200">
                  <option value="male">Мужской</option>
                  <option value="female">Женский</option>
                </select>
              </label>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <label class="block">
                <div class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold mb-1">Рост</div>
                <input type="number" step="0.1" inputmode="decimal" name="height" class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" placeholder="175"/>
              </label>
              <label class="block">
                <div class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold mb-1">Грудь</div>
                <input type="number" step="0.1" inputmode="decimal" name="chest" class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" placeholder="100"/>
              </label>
              <label class="block">
                <div class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold mb-1">Плечи</div>
                <input type="number" step="0.1" inputmode="decimal" name="shoulders" class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" placeholder="46"/>
              </label>
              <label class="block">
                <div class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold mb-1">Талия</div>
                <input type="number" step="0.1" inputmode="decimal" name="waist" class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" placeholder="85"/>
              </label>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <label class="block">
                <div class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold mb-1">Бёдра</div>
                <input type="number" step="0.1" inputmode="decimal" name="hips" class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" placeholder="98"/>
              </label>
              <label class="block">
                <div class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold mb-1">Рука</div>
                <input type="number" step="0.1" inputmode="decimal" name="arm_length" class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" placeholder="62"/>
              </label>
              <label class="block">
                <div class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold mb-1">Нога (внешн.)</div>
                <input type="number" step="0.1" inputmode="decimal" name="leg_length" class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" placeholder="102"/>
              </label>
            </div>

            <div class="flex items-center gap-2">
              <button type="submit" id="btn-save-profile" class="flex-1 px-4 py-3 rounded-2xl bg-gray-900 text-white font-extrabold text-xs uppercase tracking-widest hover:bg-indigo-600 transition">
                Сохранить
              </button>
              <button type="button" id="btn-cancel-edit" class="hidden px-4 py-3 rounded-2xl bg-gray-50 border border-gray-200 text-gray-700 font-extrabold text-xs uppercase tracking-widest">
                Отмена
              </button>
            </div>

            <input type="hidden" name="id" />
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden">
    <div class="w-full h-full md:flex md:items-center md:justify-center p-0 md:p-4">
      <div class="bg-white w-full h-full md:h-auto md:max-w-4xl md:rounded-[2rem] overflow-hidden md:max-h-[95vh] overflow-y-auto shadow-2xl">
        <div class="p-5 sm:p-7 md:p-10">
          <div class="flex items-start justify-between gap-3 border-b border-gray-100 pb-4 mb-4">
            <div class="min-w-0">
              <div id="modal-title" class="font-black text-2xl truncate">—</div>
              <div id="modal-subtitle" class="text-sm text-gray-500 mt-1">—</div>
            </div>
            <button id="btn-close-modal" class="px-4 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-extrabold text-[11px] uppercase tracking-widest transition">Закрыть</button>
          </div>

          <div class="mt-5 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="rounded-3xl border border-gray-100 overflow-hidden bg-gray-50 shadow-sm">
              <img id="modal-image" alt="" class="w-full h-full object-cover min-h-[300px]" />
            </div>
            <div class="space-y-4">
              <div class="p-5 rounded-3xl border border-gray-100 bg-white shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <div class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold">Совпадение</div>
                    <div id="modal-score" class="text-3xl font-black text-indigo-600">—</div>
                </div>
                <div id="modal-explain" class="mt-3 text-sm text-gray-700 space-y-2 leading-relaxed">—</div>
              </div>

              <div class="p-5 rounded-3xl border border-gray-100 bg-white shadow-sm">
                <div class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold mb-3">Замеры из базы</div>
                <div id="modal-metrics" class="space-y-1"></div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="/index.js"></script>
</body>
</html>
