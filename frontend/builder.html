<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Fit — Builder</title>
</head>
<body class="bg-slate-950 text-slate-100">
<div class="max-w-4xl mx-auto p-4 space-y-6">

  <div class="flex justify-between items-center gap-3">
    <h1 class="text-2xl font-bold">Builder (ручной ввод)</h1>
    <div class="flex gap-2">
      <a href="/" class="px-3 py-2 rounded-xl bg-slate-800 text-sm">Главная</a>
      <a href="/admin" class="px-3 py-2 rounded-xl bg-slate-800 text-sm">Админ</a>
    </div>
  </div>

  <div id="msg" class="text-sm text-slate-300"></div>

  <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 space-y-3">
    <h2 class="font-semibold">Основное</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
      <input id="sku" placeholder="SKU (обязательно)" class="w-full p-2 rounded bg-slate-800">
      <input id="name" placeholder="Название" class="w-full p-2 rounded bg-slate-800">
      <input id="price" placeholder="Цена" type="number" class="w-full p-2 rounded bg-slate-800">
      <input id="image_url" placeholder="URL фото" class="w-full p-2 rounded bg-slate-800">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
      <input id="size_label" placeholder="Размер (например M)" class="w-full p-2 rounded bg-slate-800">
      <input id="platform" placeholder="platform (ostin/lamoda/manual)" class="w-full p-2 rounded bg-slate-800">
      <label class="flex items-center gap-2 text-sm text-slate-300">
        <input id="in_stock" type="checkbox" checked>
        В наличии
      </label>
    </div>
  </div>

  <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 space-y-3">
    <h2 class="font-semibold">Реальные замеры вещи (как померял в магазине)</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
      <input id="g_chest" placeholder="Грудь изделия" type="number" class="p-2 rounded bg-slate-800">
      <input id="g_waist" placeholder="Талия изделия" type="number" class="p-2 rounded bg-slate-800">
      <input id="g_hips" placeholder="Бёдра изделия" type="number" class="p-2 rounded bg-slate-800">
      <input id="g_length" placeholder="Длина" type="number" class="p-2 rounded bg-slate-800">
      <input id="g_sleeve" placeholder="Рукав" type="number" class="p-2 rounded bg-slate-800">
      <input id="g_shoulders" placeholder="Плечи" type="number" class="p-2 rounded bg-slate-800">
    </div>
  </div>

  <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 space-y-3">
    <h2 class="font-semibold">Примерка</h2>
    <select id="fit_score" class="w-full p-2 rounded bg-slate-800">
      <option value="">Оценка посадки</option>
      <option value="-2">-2 сильно мало</option>
      <option value="-1">-1 мало</option>
      <option value="0">0 идеально</option>
      <option value="1">1 свободно</option>
      <option value="2">2 сильно свободно</option>
    </select>
    <label class="flex items-center gap-2 text-sm text-slate-300">
      <input id="ideal" type="checkbox">
      Идеально для меня
    </label>
    <textarea id="notes" placeholder="Комментарий" class="w-full p-2 rounded bg-slate-800 h-20"></textarea>
  </div>

  <div class="flex flex-col md:flex-row gap-2">
    <button id="btnSave" class="flex-1 bg-green-500 text-black font-semibold p-3 rounded-2xl">Сохранить</button>
    <button id="btnDelete" class="flex-1 bg-red-500 text-black font-semibold p-3 rounded-2xl hidden">Удалить товар</button>
    <button id="btnNew" class="flex-1 bg-slate-800 font-semibold p-3 rounded-2xl">Новый</button>
  </div>

  <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
    <div class="flex items-center justify-between">
      <h2 class="font-semibold">Последние товары</h2>
      <button id="btnRefresh" class="text-sm text-sky-300">обновить</button>
    </div>
    <div id="items" class="mt-3 space-y-2"></div>
  </div>

</div>

<script src="/builder.js"></script>
</body>
</html>
