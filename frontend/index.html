<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EComp — Сбор статистики</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        
        /* Профиль */
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        /* Аккордеон */
        .accordion { background: white; border-radius: 10px; margin-bottom: 10px; border: 1px solid #eee; overflow: hidden; }
        .acc-header { padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .acc-header:hover { background: #fdfdfd; }
        .acc-body { padding: 0 20px; max-height: 0; overflow: hidden; transition: 0.3s ease-out; background: #fafafa; }
        .accordion.open .acc-body { padding: 20px; max-height: 1000px; border-top: 1px solid #eee; }
        
        /* Статистика и кнопки */
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-save { background: var(--success); margin-top: 15px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        
        /* Таблица админа */
        #admin-panel { display: none; margin-top: 40px; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>👤 Мой профиль и замеры</h2>
        <div class="grid">
            <div><label>Имя</label><input type="text" id="user_name" value="Тестер 1"></div>
            <div><label>Обхват груди</label><input type="number" id="u_chest" value="96"></div>
            <div><label>Обхват талии</label><input type="number" id="u_waist" value="84"></div>
        </div>
        <button class="btn" style="margin-top:15px" onclick="calculateFit()">Найти и рассчитать припуски</button>
    </div>

    <div id="results-area"></div>

    <button onclick="toggleAdmin()" style="background:none; border:none; color:#ccc; cursor:pointer; margin-top:50px">Админ-панель</button>
    <div id="admin-panel" class="card">
        <h3>📊 Накопленная статистика</h3>
        <table id="admin-table">
            <thead><tr><th>Дата</th><th>Юзер</th><th>Вещь</th><th>Реал (Г/Т)</th><th>Подошло?</th><th>Вывод</th></tr></thead>
            <tbody id="admin-body"></tbody>
        </table>
    </div>
</div>

<script>
    // Раскрытие карточки
    function toggleAcc(el) { el.parentElement.classList.toggle('open'); }

    // Расчет подбора
    async function calculateFit() {
        const params = {
            chest: parseFloat(document.getElementById('u_chest').value),
            waist: parseFloat(document.getElementById('u_waist').value)
        };
        const resArea = document.getElementById('results-area');
        resArea.innerHTML = "Загрузка товаров...";

        const response = await fetch('/api/match', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(params)
        });
        const data = await response.json();
        
        resArea.innerHTML = "<h2>Результаты подбора (O'stin Ангарск)</h2>";
        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'accordion';
            div.innerHTML = `
                <div class="acc-header" onclick="toggleAcc(this)">
                    <span><strong>${item.name}</strong> (Арт: ${item.sku})</span>
                    <span class="badge" style="background:${item.score > 3 ? '#28a745':'#dc3545'}">Рейтинг: ${item.score}/5</span>
                </div>
                <div class="acc-body">
                    <p><strong>Данные парсинга:</strong> Грудь ${item.parsed_data.chest}см, Талия ${item.parsed_data.waist}см</p>
                    <hr>
                    <h4>📝 Замер в магазине (реальный)</h4>
                    <div class="grid">
                        <div><label>Реальная грудь (изделие)</label><input type="number" id="r_chest_${item.id}" placeholder="см"></div>
                        <div><label>Реальная талия (изделие)</label><input type="number" id="r_waist_${item.id}" placeholder="см"></div>
                    </div>
                    <div style="margin-top:10px">
                        <label><input type="checkbox" id="f_chest_${item.id}"> Подошло в груди</label><br>
                        <label><input type="checkbox" id="f_waist_${item.id}"> Подошло в талии</label>
                    </div>
                    <div style="margin-top:10px">
                        <label>Общий вывод / Заметки</label>
                        <textarea id="note_${item.id}" placeholder="Например: Ткань жестче чем казалось"></textarea>
                    </div>
                    <button class="btn btn-save" onclick="saveStat(${item.id})">Сохранить замер в базу</button>
                </div>
            `;
            resArea.appendChild(div);
        });
    }

    // Сохранение статистики
    async function saveStat(productId) {
        const data = {
            user_name: document.getElementById('user_name').value,
            product_id: productId,
            user_chest: parseFloat(document.getElementById('u_chest').value),
            user_waist: parseFloat(document.getElementById('u_waist').value),
            real_chest: parseFloat(document.getElementById(`r_chest_${productId}`).value || 0),
            real_waist: parseFloat(document.getElementById(`r_waist_${productId}`).value || 0),
            fit_chest: document.getElementById(`f_chest_${productId}`).checked,
            fit_waist: document.getElementById(`f_waist_${productId}`).checked,
            conclusion: document.getElementById(`note_${productId}`).value
        };

        const resp = await fetch('/api/save-test', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        if(resp.ok) alert("Данные сохранены для статистики!");
    }

    // Админка
    async function toggleAdmin() {
        const panel = document.getElementById('admin-panel');
        if(panel.style.display === 'block') { panel.style.display = 'none'; return; }
        
        const resp = await fetch('/api/admin/stats');
        const stats = await resp.json();
        const body = document.getElementById('admin-body');
        body.innerHTML = "";
        stats.forEach(s => {
            body.innerHTML += `<tr><td>${s.date}</td><td>${s.user}</td><td>${s.product}</td><td>${s.real_vs_parsed}</td><td>${s.fit}</td><td>${s.conclusion}</td></tr>`;
        });
        panel.style.display = 'block';
    }
</script>

</body>
</html>
