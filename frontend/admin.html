<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Fit — Admin (v3.1)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 pb-24">

  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-gray-100">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="/" class="w-10 h-10 rounded-2xl bg-gray-900 text-white flex items-center justify-center font-black shadow">Fit</a>
        <div>
          <div class="font-black text-lg">Admin</div>
          <div class="text-[11px] text-gray-500 -mt-0.5">Engine: <span class="font-bold">v3.1</span></div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a href="/builder" class="px-3 py-2 rounded-xl bg-indigo-600 text-white text-xs font-black hover:bg-indigo-700">Builder</a>
        <button id="btn-refresh" class="px-3 py-2 rounded-xl border border-gray-200 bg-white text-xs font-bold hover:bg-gray-50">Обновить</button>
      </div>
    </div>
  </header>

  <div id="toast" class="hidden fixed top-5 right-5 z-50 max-w-sm px-4 py-3 rounded-2xl bg-gray-900 text-white text-sm shadow-2xl"></div>

  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <section class="bg-white rounded-3xl border border-gray-100 shadow-sm p-5">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <div class="font-black text-lg">Статистика</div>
          <div class="text-xs text-gray-500 mt-1">Товары / Профили / Фидбек.</div>
        </div>
        <div id="stats" class="flex flex-wrap gap-2"></div>
      </div>
    </section>

    <section class="bg-white rounded-3xl border border-gray-100 shadow-sm p-5 space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <div class="font-black text-lg">Товары</div>
          <div class="text-xs text-gray-500 mt-1">Поиск и удаление. Переход в Builder по SKU.</div>
        </div>
        <div class="flex flex-col sm:flex-row gap-2 sm:items-center">
          <input id="q" placeholder="Поиск (sku / name)" class="px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 font-bold min-w-[260px]" />
          <button id="btn-clear" class="px-3 py-2 rounded-xl border border-gray-200 bg-white text-xs font-bold hover:bg-gray-50">Очистить</button>
        </div>
      </div>

      <div id="list" class="space-y-3"></div>
      <div id="empty" class="hidden text-sm text-gray-500 text-center py-6">Список пуст</div>
    </section>

  </main>

  <script src="/static/index.js"></script>
</body>
</html>
